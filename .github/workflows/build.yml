name: Compilar

on:
  push:
    branches:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Revit ${{ matrix.revit }}
    # Windows es obligatorio: los add-ins usan WPF y WinForms, y esos SDK de
    # escritorio no existen fuera de Windows (en Linux la compilación falla).
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        revit: [2021, 2022, 2023, 2024, 2025, 2026]
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Compilar Link Workset Inspector
        run: dotnet build -c Release -p:RevitVersion=${{ matrix.revit }} -p:SkipAddinDeploy=true src/LinkWorksetInspector/LinkWorksetInspector.csproj

      - name: Compilar Cota rápida
        run: dotnet build -c Release -p:RevitVersion=${{ matrix.revit }} -p:SkipAddinDeploy=true src/QuickDimension/QuickDimension.csproj

      # El zip resultante se descomprime tal cual dentro de
      # %AppData%\Autodesk\Revit\Addins\<versión>\
      - name: Preparar paquete de instalación
        shell: bash
        run: |
          mkdir -p staging/LinkWorksetInspector staging/QuickDimension
          cp manifest/LinkWorksetInspector.addin staging/
          cp manifest/QuickDimension.addin staging/
          cp src/LinkWorksetInspector/bin/Release/LinkWorksetInspector.dll staging/LinkWorksetInspector/
          cp src/QuickDimension/bin/Release/QuickDimension.dll staging/QuickDimension/

      - name: Publicar artefacto
        uses: actions/upload-artifact@v6
        with:
          name: MJTools-Revit${{ matrix.revit }}
          path: staging/
          if-no-files-found: error
